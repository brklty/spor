<script>
const BOM = "\uFEFF";

let state = {
  screen: "home",
  selectedProgram: null,
  historyFilterFrom: "",
  historyFilterTo: "",
  previousScreen: null,
  promptModalOpen: false,
};

// ===== CSV helpers (basic quoted CSV) =====
function csvEscape(val){
  if(val === null || val === undefined) return "\"\"";
  const s = String(val).replace(/\r/g, "").replace(/"/g, "\"\"");
  return `"${s}"`;
}

function parseCSVLine(line){
  // Minimal RFC4180-ish parser for quotes and commas.
  let out = [];
  let cur = "";
  let inQ = false;

  for(let i=0;i<line.length;i++){
    const ch = line[i];
    if(inQ){
      if(ch === "\""){
        if(line[i+1] === "\""){ cur += "\""; i++; }
        else { inQ = false; }
      } else {
        cur += ch;
      }
    } else {
      if(ch === ","){
        out.push(cur);
        cur = "";
      } else if(ch === "\""){
        inQ = true;
      } else {
        cur += ch;
      }
    }
  }

  out.push(cur);
  return out.map(x=>x.trim());
}

// ===== Storage =====
function normalizeProgram(program){
  if(!program || typeof program !== "object") return program;

  const metadata = {};
  if(program.metadata && typeof program.metadata === "object"){
    Object.entries(program.metadata).forEach(([k,v])=>{
      if(v !== undefined && v !== null) metadata[k] = String(v);
    });
  }

  const normalized = { ...program };
  normalized.metadata = metadata;
  normalized.name = normalized.name || metadata.ProgramName || metadata.programName || "";
  normalized.Mesocycle = normalized.Mesocycle ?? normalized.mesocycle ?? metadata.Mesocycle ?? metadata.mesocycle ?? "";
  normalized.Goal = normalized.Goal ?? normalized.goal ?? metadata.Goal ?? metadata.goal ?? "";
  normalized.DurationWeeks = normalized.DurationWeeks ?? normalized.durationWeeks ?? metadata.DurationWeeks ?? metadata.durationWeeks ?? "";
  normalized.CoachVersion = normalized.CoachVersion ?? normalized.coachVersion ?? metadata.CoachVersion ?? metadata.coachVersion ?? "";
  normalized.CreatedBy = normalized.CreatedBy ?? normalized.createdBy ?? metadata.CreatedBy ?? metadata.createdBy ?? "";
  normalized.CreatedDate = normalized.CreatedDate ?? normalized.createdDate ?? metadata.CreatedDate ?? metadata.createdDate ?? "";
  normalized.Notes = normalized.Notes ?? normalized.notes ?? metadata.Notes ?? metadata.notes ?? "";
  normalized.mesocycle = normalized.Mesocycle;
  normalized.goal = normalized.Goal;
  normalized.durationWeeks = normalized.DurationWeeks;
  normalized.coachVersion = normalized.CoachVersion;
  normalized.createdBy = normalized.CreatedBy;
  normalized.createdDate = normalized.CreatedDate;
  normalized.notes = normalized.Notes;

  normalized.days = (normalized.days || []).map(day=>{
    const normalizedDay = { ...day };
    normalizedDay.SessionRPE = normalizedDay.SessionRPE ?? normalizedDay.sessionRPE ?? "";
    normalizedDay.sessionRPE = normalizedDay.SessionRPE;
    normalizedDay.records = normalizedDay.records || {};
    normalizedDay.comments = normalizedDay.comments || {};
    normalizedDay.exercises = (normalizedDay.exercises || []).map(ex=>{
      if(typeof ex === "string") return { name: ex, sets: 1, reps: "" };
      const normalizedEx = { ...ex };
      normalizedEx.Pain = normalizedEx.Pain ?? normalizedEx.pain ?? "";
      normalizedEx.ExerciseVariant = normalizedEx.ExerciseVariant ?? normalizedEx.variant ?? "";
      normalizedEx.pain = normalizedEx.Pain;
      normalizedEx.variant = normalizedEx.ExerciseVariant;
      return normalizedEx;
    });
    return normalizedDay;
  });
  return normalized;
}

function normalizePrograms(programs){
  return (programs || []).map(normalizeProgram);
}

function getPrograms() { return normalizePrograms(JSON.parse(localStorage.getItem("programs") || "[]")); }
function savePrograms(p) { localStorage.setItem("programs", JSON.stringify(normalizePrograms(p || []))); }
function getMeasures() { return JSON.parse(localStorage.getItem("measures") || "[]"); }
function saveMeasures(m) { localStorage.setItem("measures", JSON.stringify(m)); }
function getMovementHistory() { return JSON.parse(localStorage.getItem("movementHistory") || "[]"); }
function saveMovementHistory(history) { localStorage.setItem("movementHistory", JSON.stringify(history)); }

function formatDisplayDate(dateStr){
  if(!dateStr) return "";
  const parts = String(dateStr).split("-");
  if(parts.length !== 3) return dateStr;
  const [y,m,d] = parts;
  return `${d}.${m}.${y}`;
}

function syncMovementHistoryFromPrograms(){
  const programs = getPrograms();
  const history = getMovementHistory();
  const existingKeys = new Set(history.map(item => item.key));

  programs.forEach(program => {
    const programName = program.name || "";
    (program.days || []).forEach(day => {
      const date = day.date || "";
      if(!date) return;
      (day.exercises || []).forEach(ex => {
        const exerciseName = ex.name || "";
        const sets = Array.isArray(day.records?.[exerciseName])
          ? day.records[exerciseName].map(set => ({ kg: set.kg || "", rep: set.rep || "" }))
          : [];
        const pain = (ex.Pain ?? ex.pain ?? "") || "";
        const note = day.comments?.[exerciseName] || "";
        const key = `${date}::${programName}::${day.name || ""}::${exerciseName}`;
        if(existingKeys.has(key)) return;

        history.push({
          key,
          date,
          programName,
          dayName: day.name || "",
          exerciseName,
          sets,
          pain,
          note,
        });
        existingKeys.add(key);
      });
    });
  });

  if(history.length !== getMovementHistory().length){
    saveMovementHistory(history);
  }
}

function buildHistoryEntryFromWorkout({date, programName, dayName, exerciseName, sets, pain, note}){
  return {
    key: `${date}::${programName}::${dayName || ""}::${exerciseName}`,
    date,
    programName,
    dayName,
    exerciseName,
    sets: (sets || []).map(set => ({ kg: set.kg || "", rep: set.rep || "" })),
    pain: pain || "",
    note: note || "",
  };
}

    text.select();
    text.setSelectionRange(0, text.value.length);

  if(state.previousScreen){
    const target = state.previousScreen;
    state.previousScreen = null;
    state.screen = target;
    render();
    return;

  goHome();
}

  `;

});

function drawMeasureCharts(){
  let measures = getMeasures().slice().sort((a,b)=> a.date.localeCompare(b.date));

  const weightData = measures.filter(m=>m.weight).map(m=>({x:m.date, v:parseFloat(m.weight)}));
  drawLineChart("weightChart", weightData, "#007aff");

  const key = document.getElementById("measureSelect").value;
  const colorMap = { waist:"#ff9500", chest:"#34c759", arm:"#af52de", shoulder:"#ff3b30", hip:"#5ac8fa" };
  const mData = measures.filter(m=>m[key]).map(m=>({x:m.date, v:parseFloat(m[key])}));
  drawLineChart("measureChart", mData, colorMap[key] || "#000");
}

function drawLineChart(canvasId, data, color){
  const c = document.getElementById(canvasId);
  if(!c) return;
  const ctx = c.getContext("2d");
  ctx.clearRect(0,0,c.width,c.height);

  if(data.length < 1){
    ctx.fillStyle="#999";
    ctx.fillText("Yeterli veri yok", 20, 40);
    return;
  }

  const pad = 40;
  const w = c.width - pad*2;
  const h = c.height - pad*2;

  const minY = Math.min(...data.map(d=>d.v));
  const maxY = Math.max(...data.map(d=>d.v));
  const range = (maxY - minY) || 1;

  // axes
  ctx.strokeStyle="#ccc";
  ctx.beginPath();
  ctx.moveTo(pad,pad);
  ctx.lineTo(pad,pad+h);
  ctx.lineTo(pad+w,pad+h);
  ctx.stroke();

  // labels
  ctx.fillStyle="#666";
  ctx.font="12px sans-serif";
  ctx.fillText(maxY.toFixed(1), 5, pad+5);
  ctx.fillText(minY.toFixed(1), 5, pad+h);

  // line
  ctx.strokeStyle=color;
  ctx.lineWidth=2;
  ctx.beginPath();

  data.forEach((d,i)=>{
    const x = pad + (i/(data.length-1||1))*w;
    const y = pad + h - ((d.v - minY)/range)*h;
    if(i===0) ctx.moveTo(x,y); else ctx.lineTo(x,y);

    ctx.fillStyle=color;
    ctx.beginPath();
    ctx.arc(x,y,3,0,Math.PI*2);
    ctx.fill();
  });

  ctx.stroke();
}

  add("Created Date", p.CreatedDate || meta.CreatedDate || meta.createdDate || "");

  return values;
}

function parseCSV(text){
  const lines = text.replace(/\r/g,"").split("\n").map(l=>l.trim()).filter(l=>l);
  if(lines.length < 2){
    alert("CSV dosyasi bos veya hatali.");
    return;
  }

  const rows = lines.map(parseCSVLine).filter(r=>r.some(x=>x));
  if(isImportableProgramCSV(rows)){
    importProgramMetadataCSV(rows);
    return;
  }

  const header = rows[0] || [];
  const bodyRows = rows.slice(1);
  const headerJoined = header.map(x=>x.toLowerCase()).join(",");
  const isPlanCSV = headerJoined.includes("hafta") && headerJoined.includes("hareket");
  const isWorkoutCSV = headerJoined.includes("setno") && headerJoined.includes("kg") && headerJoined.includes("tekrar");

  if(isPlanCSV){
    importProgramPlanCSV(bodyRows);
    return;
  }

  if(isWorkoutCSV){
    importProgramWorkoutCSV(header, bodyRows);
    return;
  }

  alert("Bu CSV formati taninmiyor. Lutfen uygulamanin verdigi CSV formatini kullan.");
}

function isImportableProgramCSV(rows){
  const normalized = rows.map(r=>r.map(x=>String(x||"").trim().toLowerCase()));
  const hasMetaProgramName = normalized.some(r=>r[0]==="meta" && r.some((cell,i)=>i>0 && cell==="programname"));
  const hasMetaKeyValueHeader = normalized.some(r=>r[0]==="type" && r[1]==="key" && r[2]==="value");
  const hasProgramExerciseHeader = normalized.some(r=>r[0]==="program" && r[3]==="exercise");
  return hasMetaProgramName || hasMetaKeyValueHeader || hasProgramExerciseHeader;
}

function importProgramMetadataCSV(rows){
  const meta = {};
  let programName = "Imported Program";
  let dayMap = {};
  let program = { name: programName, metadata: meta, days: [] };
  let sawExercise = false;

  rows.forEach(row=>{
    const normalized = row.map(x=>String(x||"").trim());
    if(!normalized.some(x=>x)) return;
    const lower = normalized.map(x=>x.toLowerCase());

    // skip header-like rows
    if(lower.includes("type") && lower.includes("key") && lower.includes("value")) return;
    if(lower.includes("program") && lower.includes("week") && lower.includes("exercise") && lower.includes("day")) return;

    // META rows in some CSVs put the key/value in the last two columns (see provided example)
    if(lower[0] === "meta"){
      // prefer explicit positions if present, otherwise fall back to last-two-columns
      let key = "";
      let value = "";
      // find last non-empty cells as key/value
      for(let i = normalized.length - 1; i >= 0; i--){
        if(normalized[i] && value === "") { value = normalized[i]; continue; }
        if(normalized[i] && key === "") { key = normalized[i]; break; }
      }
      if(key){
        meta[key] = value;
        if(key.toLowerCase() === "programname") programName = value || programName;
      }
      return;
    }

    // EXERCISE rows in the example begin with a Type column (EXERCISE) followed by Program, Week, Day, Exercise, Variant, Sets, Reps
    if(lower[0] === "exercise"){
      const programLabel = normalized[1] || "";
      const week = normalized[2] || "";
      const day = normalized[3] || "";
      const exerciseName = normalized[4] || "";
      const variant = normalized[5] || "";
      const sets = parseInt(normalized[6]);
      const reps = parseInt(normalized[7]);

      if(!exerciseName) return;
      sawExercise = true;

      if(programLabel){ programName = programLabel || programName; }

      const dayLabel = week ? `Hafta ${week} Gün ${day}` : `Gün ${day || "1"}`;
      if(!dayMap[dayLabel]){
        dayMap[dayLabel] = { name: dayLabel, exercises: [], records: {}, comments: {} };
        program.days.push(dayMap[dayLabel]);
      }

      dayMap[dayLabel].exercises.push({
        name: exerciseName,
        sets: isNaN(sets) ? 0 : sets,
        reps: isNaN(reps) ? "" : reps,
        variant: variant || "",
        ExerciseVariant: variant || ""
      });
      return;
    }

    // Fallback: support rows without the leading Type column (legacy/other exporters)
    if(normalized.length >= 4){
      // try to interpret as [Program,Week,Day,Exercise,Variant,Sets,Reps]
      const programLabel = normalized[0] || "";
      const week = normalized[1] || "";
      const day = normalized[2] || "";
      const exerciseName = normalized[3] || "";
      const variant = normalized[4] || "";
      const sets = parseInt(normalized[5]);
      const reps = parseInt(normalized[6]);

      if(!exerciseName) return;
      sawExercise = true;

      if(programLabel){ programName = programLabel || programName; }
      const dayLabel = week ? `Hafta ${week} Gün ${day}` : `Gün ${day || "1"}`;
      if(!dayMap[dayLabel]){
        dayMap[dayLabel] = { name: dayLabel, exercises: [], records: {}, comments: {} };
        program.days.push(dayMap[dayLabel]);
      }

      dayMap[dayLabel].exercises.push({
        name: exerciseName,
        sets: isNaN(sets) ? 0 : sets,
        reps: isNaN(reps) ? "" : reps,
        variant: variant || "",
        ExerciseVariant: variant || ""
      });
    }
  });

  if(!sawExercise){
    alert("Bu CSV’de egzersiz satırı bulunamadı.");
    return;
  }

  program.name = programName;
  program.metadata = meta;
  program.Mesocycle = meta.Mesocycle || meta.mesocycle || "";
  program.Goal = meta.Goal || meta.goal || "";
  program.DurationWeeks = meta.DurationWeeks || meta.durationWeeks || "";
  program.CoachVersion = meta.CoachVersion || meta.coachVersion || "";
  program.CreatedBy = meta.CreatedBy || meta.createdBy || "";
  program.CreatedDate = meta.CreatedDate || meta.createdDate || "";
  program.Notes = meta.Notes || meta.notes || "";
  program.mesocycle = program.Mesocycle;
  program.goal = program.Goal;
  program.durationWeeks = program.DurationWeeks;
  program.coachVersion = program.CoachVersion;
  program.createdBy = program.CreatedBy;
  program.createdDate = program.CreatedDate;
  program.notes = program.Notes;

  importProgramBackup(program);
}

function exportProgramCSV(i){
  const programs = getPrograms();
  const p = normalizeProgram(programs[i]);
  const meta = p.metadata || {};
  let rows = [];

  rows.push(["Type","Key","Value"].join(","));
  const metaEntries = Object.entries(meta);
  if(metaEntries.length > 0){
    metaEntries.forEach(([key,value])=>{
      rows.push(["META", csvEscape(key), csvEscape(value)].join(","));
    });
  }
  if(!metaEntries.some(([key])=>key.toLowerCase()==="programname")){
    rows.push(["META", "ProgramName", csvEscape(p.name || "")].join(","));
  }
  if(!metaEntries.some(([key])=>key.toLowerCase()==="mesocycle")){
    rows.push(["META", "Mesocycle", csvEscape(p.Mesocycle || p.mesocycle || "")].join(","));
  }
  if(!metaEntries.some(([key])=>key.toLowerCase()==="goal")){
    rows.push(["META", "Goal", csvEscape(p.Goal || p.goal || "")].join(","));
  }
  if(!metaEntries.some(([key])=>key.toLowerCase()==="durationweeks")){
    rows.push(["META", "DurationWeeks", csvEscape(p.DurationWeeks || p.durationWeeks || "")].join(","));
  }
  if(!metaEntries.some(([key])=>key.toLowerCase()==="coachversion")){
    rows.push(["META", "CoachVersion", csvEscape(p.CoachVersion || p.coachVersion || "")].join(","));
  }
  if(!metaEntries.some(([key])=>key.toLowerCase()==="createddate")){
    rows.push(["META", "CreatedDate", csvEscape(p.CreatedDate || p.createdDate || "")].join(","));
  }
  if(!metaEntries.some(([key])=>key.toLowerCase()==="notes")){
    rows.push(["META", "Notes", csvEscape(p.Notes || p.notes || "")].join(","));
  }

  rows.push(["Program","Week","Day","Exercise","Variant","Sets","Reps"].join(","));
  p.days.forEach((d, dayIndex)=>{
    (d.exercises || []).forEach(ex=>{
      const variant = ex.ExerciseVariant || ex.variant || "";
      rows.push([
        csvEscape(p.name || ""),
        csvEscape(dayIndex + 1),
        csvEscape(d.name || dayIndex + 1),
        csvEscape(ex.name || ""),
        csvEscape(variant),
        csvEscape(ex.sets || ""),
        csvEscape(ex.reps || "")
      ].join(","));
    });
  });

  const csv = BOM + rows.join("\n");
  downloadFile(`program_${p.name}_import.csv`, csv, "text/csv;charset=utf-8;");
}

// ===== BACKUP IMPORT =====

function startImportBackup(){
  document.getElementById("backupInput").value = "";
  document.getElementById("backupInput").click();
}

document.getElementById("backupInput").addEventListener("change", function(e){
  const file = e.target.files[0];
  if(!file) return;

  const reader = new FileReader();
  reader.onload = function(evt){
    try {
      const data = JSON.parse(evt.target.result);
      handleBackupImport(data);
    } catch(err){
      alert("Bu dosya geçerli bir JSON yedeği değil.");
    }
  };
  reader.readAsText(file);
});

function handleBackupImport(data){
  // Tüm veri yedeği mi?
  if(data && data.type === "sporTakipBackup"){
    handleAllDataImport(data);
    return;
  }

  // Program yedeği mi?
  if(data && data.name && data.days){
    importProgramBackup(data);
    return;
  }

  // Ölçü yedeği mi?
  if(Array.isArray(data) && data.length && data[0].date){
    importMeasureBackup(data);
    return;
  }

  alert("Bu dosya tanınan bir yedek formatı değil.");
}

// ---- PROGRAM IMPORT ----
function importProgramBackup(p){
  let programs = getPrograms();

  const existingIndex = programs.findIndex(x => x.name === p.name);

  if(existingIndex !== -1){
    const overwrite = confirm(
      `"${p.name}" adlı bir program zaten var.\n\nOK = Üzerine yaz\nİptal = Kopya olarak ekle`
    );

    if(overwrite){
      programs[existingIndex] = p;
    } else {
      let base = p.name;
      let i = 2;
      let newName = base + "_" + i;
      while(programs.find(x => x.name === newName)){
        i++;
        newName = base + "_" + i;
      }
      const copy = JSON.parse(JSON.stringify(p));
      copy.name = newName;
      programs.push(copy);
    }
  } else {
    programs.push(p);
  }

  savePrograms(programs);
  alert("Program içe aktarıldı ✅");
  render();
}

// ---- MEASURE IMPORT ----
function importMeasureBackup(arr){
  let measures = getMeasures();

  arr.forEach(m=>{
    measures = measures.filter(x => x.date !== m.date);
    measures.push(m);
  });

  saveMeasures(measures);
  alert("Ölçü yedeği içe aktarıldı ✅");
  render();
}

document.getElementById("allDataInput").addEventListener("change", function(e){
  const file = e.target.files[0];
  if(!file) return;
  e.target.value = "";

  const reader = new FileReader();
  reader.onload = function(evt){
    try {
      const data = JSON.parse(evt.target.result);
      handleAllDataImport(data);
    } catch(err){
      alert("Bu dosya geçerli bir JSON yedeği değil.");
    }
  };
  reader.readAsText(file);
});

function handleAllDataImport(data){
  // Accept both envelope and legacy shapes.
  let payload = data;
  if(data && data.type === "sporTakipBackup" && data.data){
    payload = data.data;
  }

  const incomingPrograms = Array.isArray(payload?.programs) ? payload.programs : [];
  const incomingMeasures = Array.isArray(payload?.measures) ? payload.measures : [];

  // If this is not an all-data backup, try to fall back to known importers.
  if(incomingPrograms.length === 0 && incomingMeasures.length === 0){
    if(data && data.name && data.days){ importProgramBackup(data); return; }
    if(Array.isArray(data) && data.length && data[0].date){ importMeasureBackup(data); return; }

    alert("Bu dosya tanınan bir tüm-veri yedeği değil.");
    return;
  }

  const replaceAll = confirm("Tüm veriler içe aktarılacak.\n\nOK = Mevcut verilerin üzerine yaz (sıfırla)\nİptal = Mevcut verilerle birleştir");

  if(replaceAll){
    savePrograms(incomingPrograms);
    saveMeasures(incomingMeasures);

    if(payload?.lastUpdatedDay){
      localStorage.setItem("lastUpdatedDay", payload.lastUpdatedDay);
    } else {
      localStorage.removeItem("lastUpdatedDay");
    }

    alert("Tüm veriler içe aktarıldı ✅");
    goHome();
    return;
  }

  // Merge flow (no per-program prompts).
  const overwriteConflicts = confirm("Aynı isimli programlar varsa nasıl davranalım?\n\nOK = Üzerine yaz\nİptal = Kopya olarak ekle");

  let existingPrograms = getPrograms();
  incomingPrograms.forEach(p=>{
    const idx = existingPrograms.findIndex(x => x.name === p.name);
    if(idx === -1){
      existingPrograms.push(p);
      return;
    }

    if(overwriteConflicts){
      existingPrograms[idx] = p;
      return;
    }

    let base = p.name;
    let i = 2;
    let newName = base + "_" + i;
    while(existingPrograms.find(x => x.name === newName)){
      i++;
      newName = base + "_" + i;
    }
    const copy = JSON.parse(JSON.stringify(p));
    copy.name = newName;
    existingPrograms.push(copy);
  });
  savePrograms(existingPrograms);

  let existingMeasures = getMeasures();
  incomingMeasures.forEach(m=>{
    existingMeasures = existingMeasures.filter(x => x.date !== m.date);
    existingMeasures.push(m);
  });
  saveMeasures(existingMeasures);

  alert("Tüm veriler birleştirildi ✅");
  goHome();
}

// ===== CSV import variants =====
function importProgramPlanCSV(rows){
  if(!rows.length){
    alert("CSV boş.");
    return;
  }

  const programName = (rows[0][0] || "").trim();
  if(!programName){
    alert("Program adı bulunamadı.");
    return;
  }

  let program = { name: programName, days: [] };
  let dayMap = {};

  rows.forEach(r=>{
    const week = (r[1] || "").trim();
    const day = (r[2] || "").trim();
    const exercise = (r[3] || "").trim();
    const sets = parseInt(r[4]);
    const reps = parseInt(r[5]);

    if(!exercise) return;

    const key = `Hafta ${week} Gün ${day}`;
    if(!dayMap[key]){
      dayMap[key] = { name: key, exercises: [] };
      program.days.push(dayMap[key]);
    }
    dayMap[key].exercises.push({
      name: exercise,
      sets: isNaN(sets) ? 0 : sets,
      reps: isNaN(reps) ? "" : reps
    });
  });

  let programs = getPrograms();
  const existingIndex = programs.findIndex(x => x.name === program.name);

  if(existingIndex !== -1){
    const overwrite = confirm(`"${program.name}" adlı bir program zaten var.\n\nOK = Üzerine yaz\nİptal = Kopya olarak ekle`);
    if(overwrite){
      programs[existingIndex] = program;
    } else {
      let base = program.name;
      let i = 2;
      let newName = base + "_" + i;
      while(programs.find(x => x.name === newName)){
        i++;
        newName = base + "_" + i;
      }
      program = JSON.parse(JSON.stringify(program));
      program.name = newName;
      programs.push(program);
    }
  } else {
    programs.push(program);
  }

  savePrograms(programs);
  alert("Program eklendi ✅");
  render();
}

function importProgramWorkoutCSV(header, rows){
  const h = header.map(x=>x.toLowerCase());
  const idxProgram = h.indexOf("program");
  const idxDay = (h.indexOf("gün") !== -1) ? h.indexOf("gün") : h.indexOf("gun");
  const idxEx = h.indexOf("hareket");
  const idxSetNo = h.indexOf("setno");
  const idxKg = h.indexOf("kg");
  const idxRep = h.indexOf("tekrar");
  const idxNote = h.indexOf("not");

  if([idxProgram, idxDay, idxEx, idxSetNo, idxKg, idxRep].some(x=>x === -1)){
    alert("Antrenman CSV basligi eksik/hatali.");
    return;
  }

  const programName = (rows[0]?.[idxProgram] || "").trim();
  if(!programName){
    alert("Program adı bulunamadı.");
    return;
  }

  let program = { name: programName, days: [] };
  let dayMap = {};

  function getDay(dayName){
    if(!dayMap[dayName]){
      dayMap[dayName] = { name: dayName, exercises: [], records: {}, comments: {}, _exMap: {} };
      program.days.push(dayMap[dayName]);
    }
    return dayMap[dayName];
  }

  rows.forEach(r=>{
    const dayName = (r[idxDay] || "").trim();
    const exName = (r[idxEx] || "").trim();
    const setNoRaw = (r[idxSetNo] || "").trim();
    const kg = (r[idxKg] || "").trim();
    const rep = (r[idxRep] || "").trim();
    const note = (idxNote !== -1) ? (r[idxNote] || "").trim() : "";

    if(!dayName || !exName) return;

    const setNo = parseInt(setNoRaw);
    if(isNaN(setNo) || setNo < 1) return;

    const day = getDay(dayName);

    if(!day.records[exName]) day.records[exName] = [];
    while(day.records[exName].length < setNo){
      day.records[exName].push({kg:"", rep:""});
    }
    day.records[exName][setNo-1] = { kg, rep };

    if(note){
      day.comments[exName] = note;
    }

    if(!day._exMap[exName]){
      day._exMap[exName] = { name: exName, sets: 0, reps: "" };
      day.exercises.push(day._exMap[exName]);
    }
    if(setNo > day._exMap[exName].sets){
      day._exMap[exName].sets = setNo;
    }
  });

  program.days.forEach(d=>{ delete d._exMap; });

  // Delegate to JSON program importer to handle name conflicts.
  importProgramBackup(program);
}

function getExerciseDisplayName(ex){
  const name = ex?.name || "";
  const variant = (ex?.ExerciseVariant ?? ex?.variant ?? "").toString().trim();
  if(!variant) return name;
  return `${name} - ${variant}`;
}

function exportMovementHistoryCSV(){
  const history = getMovementHistory().slice().sort((a,b)=> b.date.localeCompare(a.date));
  const from = state.historyFilterFrom || "";
  const to = state.historyFilterTo || "";
  const filtered = history.filter(item => {
    const itemDate = item.date || "";
    if(from && itemDate < from) return false;
    if(to && itemDate > to) return false;
    return true;
  });
  const setCount = filtered.reduce((max, item) => Math.max(max, item.sets ? item.sets.length : 0), 0);
  const headers = ["Tarih","Program Adı","Hareket Adı", ...Array.from({length:setCount},(_,i)=>`Set${i+1}`), "Pain Score","Not"];
  const rows = [headers.join(",")];
  filtered.forEach(item=>{
    const values = [
      formatDisplayDate(item.date),
      item.programName || "",
      item.exerciseName || "",
      ...Array.from({length:setCount},(_,i)=> item.sets && item.sets[i] ? `${item.sets[i].kg || ""}x${item.sets[i].rep || ""}` : ""),
      item.pain || "",
      item.note || ""
    ];
    rows.push(values.map(csvEscape).join(","));
  });
  const csv = BOM + rows.join("\n");
  downloadFile(`hareket_gecmisi_${new Date().toISOString().slice(0,10)}.csv`, csv, "text/csv;charset=utf-8;");
}

function collectAllExercises(){
  const programs = getPrograms();
  const set = new Set();

  programs.forEach(p=>{
    p.days.forEach(d=>{
      if(d.records){
        Object.keys(d.records).forEach(exName=>{
          set.add(exName);
        });
      }
    });
  });

  return Array.from(set).sort();
}

function drawExerciseChart(){
  const name = document.getElementById("exerciseSelect").value;
  const programs = getPrograms();

  let points = [];

  programs.forEach(p=>{
    p.days.forEach(d=>{
      if(d.records && d.records[name]){
        // o günkü en iyi set
        let best = 0;
        d.records[name].forEach(s=>{
          const kg = parseFloat(s.kg);
          if(!isNaN(kg)){
            if(kg > best) best = kg;
          }
        });
        if(best > 0){
          points.push({
            x: d.name,
            v: best
          });
        }
      }
    });
  });

  drawLineChart("exerciseChart", points, "#ff2d55");
}
let openHistoryIndex = null;

function toggleHistory(exName, ei){
  const el = document.getElementById("history-" + ei);

  if(el.style.display === "block"){
    el.style.display = "none";
    el.innerHTML = "";
    openHistoryIndex = null;
    return;
  }

  // başka açık varsa kapat
  if(openHistoryIndex !== null){
    const old = document.getElementById("history-" + openHistoryIndex);
    if(old){
      old.style.display = "none";
      old.innerHTML = "";
    }
  }

  const history = collectExerciseHistory(exName);

  if(history.length === 0){
    el.innerHTML = `<div class="small">Bu hareket için geçmiş kayıt yok.</div>`;
  } else {
    let html = `<div class="small"><b>📜 Son Kayıtlar</b></div>`;

    history.slice(0,3).forEach(h=>{
      html += `<div class="card" style="margin-top:8px;">
        <div class="small"><b>${h.date || "Tarih yok (eski kayıt)"}</b></div>
      `;

      h.sets.forEach((s,idx)=>{
        html += `<div class="small">#${idx+1} ${s.kg || "-"} kg x ${s.rep || "-"}</div>`;
      });

      if(h.comment){
        html += `<div class="small">📝 ${h.comment}</div>`;
      }

      html += `</div>`;
    });

    el.innerHTML = html;
  }

  el.style.display = "block";
  openHistoryIndex = ei;
}

// tüm programlardan o hareketin geçmişini toplar
function collectExerciseHistory(name){
  const programs = getPrograms();
  let list = [];

  programs.forEach(p=>{
    p.days.forEach(d=>{
      if(d.records && d.records[name]){
        list.push({
          date: d.date,
          sets: d.records[name],
          comment: d.comments ? d.comments[name] : ""
        });
      }
    });
  });

  // tarihe göre sırala (yeni → eski)
  list.sort((a,b)=>{
    if(!a.date) return 1;
    if(!b.date) return -1;
    return b.date.localeCompare(a.date);
  });

  return list;
}
function finishDayAndGoBack(){
  saveDay();               // önce kaydet
  state.selectedProgram = getPrograms()[state.programIndex]; // 🔥 KRİTİK SATIR
  renderProgramDetail();   // sonra listeye dön
}

function calculateCompletionRate(day){
  let expectedReps = 0;
  let doneReps = 0;

  // 👉 BEKLENEN: toplam tekrar
  day.exercises.forEach(ex=>{
    const sets = ex.sets || 0;
    const reps = parseInt(ex.reps) || 0;
    expectedReps += sets * reps;
  });

  // 👉 GERÇEK: girilen toplam tekrar
  if(day.records){
    Object.values(day.records).forEach(sets=>{
      sets.forEach(s=>{
        const r = parseInt(s.rep);
        if(!isNaN(r)){
          doneReps += r;
        }
      });
    });
  }

  if(expectedReps === 0) return 0;

  return Math.round((doneReps / expectedReps) * 100);
}
