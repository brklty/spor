<style>
body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; margin:0; background:#f2f2f7; }

<body>

<header>
  🏋️ Spor Takip
  <button id="homeBtn" class="home-btn" onclick="goHome()" style="display:none">🏠</button>
</header>

<div class="container" id="app"></div>
<div id="fixedFooterHost"></div>

<input type="file" id="fileInput" accept=".csv" style="display:none" />
<input type="file" id="backupInput" accept=".json" style="display:none" />
<input type="file" id="allDataInput" accept=".json" style="display:none" />


<script>
const BOM = "\uFEFF";

let state = {
  screen: "home",
  selectedProgram: null,
};

// ===== CSV helpers (basic quoted CSV) =====
function csvEscape(val){
  if(val === null || val === undefined) return "\"\"";
  const s = String(val).replace(/\r/g, "").replace(/"/g, "\"\"");
  return `"${s}"`;
}

function parseCSVLine(line){
  // Minimal RFC4180-ish parser for quotes and commas.
  let out = [];
  let cur = "";
  let inQ = false;

  for(let i=0;i<line.length;i++){
    const ch = line[i];
    if(inQ){
      if(ch === "\""){
        if(line[i+1] === "\""){ cur += "\""; i++; }
        else { inQ = false; }
      } else {
        cur += ch;
      }
    } else {
      if(ch === ","){
        out.push(cur);
        cur = "";
      } else if(ch === "\""){
        inQ = true;
      } else {
        cur += ch;
      }
    }
  }

  out.push(cur);
  return out.map(x=>x.trim());
}

// ===== Storage =====
function getPrograms() { return JSON.parse(localStorage.getItem("programs") || "[]"); }
function savePrograms(p) { localStorage.setItem("programs", JSON.stringify(p)); }
function getMeasures() { return JSON.parse(localStorage.getItem("measures") || "[]"); }
function saveMeasures(m) { localStorage.setItem("measures", JSON.stringify(m)); }

// ===== Navigation =====
function goHome(){ state.screen="home"; render(); }
function goPrograms(){ state.screen="programs"; render(); }
function goMeasures(){ state.screen="measures"; render(); }
function goMeasureExport(){ state.screen="measureExport"; render(); }
function goMeasureCharts(){ state.screen="measureCharts"; render(); }
function goExerciseCharts(){ state.screen="exerciseCharts"; render(); }


// ===== Render =====
function render(){
  const app = document.getElementById("app");
  const homeBtn = document.getElementById("homeBtn");
  const footerHost = document.getElementById("fixedFooterHost");

  homeBtn.style.display = (state.screen === "home") ? "none" : "block";

  app.innerHTML = "";
  if(footerHost) footerHost.innerHTML = "";

  if(state.screen==="home"){
    app.innerHTML = `
      <div class="card"><button onclick="goPrograms()">📋 Program Seç</button></div>
      <div class="card"><button onclick="goMeasures()">⚖️ Ölçü Takibi</button></div>
      <div class="card"><button onclick="goExerciseCharts()">📈 Gelişim Grafikleri</button></div>

      <div class="card">
        <h3>🔁 Cihaz Değiştir / Tüm Veriler</h3>
        <div class="grid">
          <button onclick="exportAllData()">📦 Tüm Verileri Export</button>
          <button onclick="startImportAllData()">📥 Tüm Verileri Import</button>
        </div>
        <div class="small">Programlar, ölçüler ve uygulamadaki diğer veriler (varsa) birlikte taşınır.</div>
      </div>

    `;
  }

  if(state.screen==="programs"){
    const programs = getPrograms();
    let html = `<div class="card"><h3>📋 Programlar</h3>`;
    programs.forEach((p,i)=>{
      html += `
        <div class="list-item" onclick="openProgram(${i})">
          <div class="list-main">${p.name}</div>
          <button class="icon-btn export" onclick="event.stopPropagation(); exportProgramMenu(${i})">📤</button>
          <button class="icon-btn" onclick="event.stopPropagation(); renameProgram(${i})">✏️</button>
          <button class="icon-btn delete" onclick="event.stopPropagation(); deleteProgram(${i})">🗑️</button>
        </div>
  `;

});

    html += `
      <div style="display:flex; gap:10px; margin-top:12px;">
        <button class="icon-btn" style="flex:1; padding:12px;" onclick="importProgram()">➕ Yeni Program Ekle (CSV)</button>
        <button class="icon-btn" style="flex:1; padding:12px;" onclick="startImportBackup()">📥 Program İçe Aktar</button>
      </div>
      <div class="small" style="margin-top:8px;">CSV ile yeni program ekleyebilir veya JSON yedeği içe aktarabilirsin.</div>
    `;

    html += `</div><button onclick="goHome()">⬅️ Geri</button>`;
    app.innerHTML = html;
  }

  if(state.screen==="programDetail"){
    const p = state.selectedProgram;
    let html = `<div class="card"><h3>${p.name}</h3>`;
    p.days.forEach((d,i)=>{
      html += `
        <div class="list-item" onclick="openDay(${i})">
          <div class="list-main">
            ${d.name} - ${
              (d.records && Object.keys(d.records).length > 0)
              ? `<span class='done'>Tamamlandı (${calculateCompletionRate(d)}%)</span>`
              : "<span class='todo'>Yapılmadı</span>"
            }

          </div>
        </div>
      `;
    });
    html += `
      </div>
      <div style="height:90px;"></div>
    `;
    app.innerHTML = html;

    if(footerHost){
      footerHost.innerHTML = `
        <div class="workout-footer">
          <button onclick="goPrograms()">⬅️ Geri</button>
        </div>
      `;
    }
  }

  if(state.screen==="workout"){
    const programs = getPrograms();
    const day = programs[state.programIndex].days[state.selectedDayIndex];

    const today = new Date().toISOString().slice(0,10);
    const selectedDate = day.date || today;

    let html = `<div class="card">
      <h3>${day.name}</h3>
      <div style="display:flex;align-items:center;gap:8px;margin-top:8px;">
      <div class="small" style="white-space:nowrap;">📅 Antreman Tarihi</div>
      <input
        type="date"
        id="workout-date"
        value="${selectedDate}"
        style="flex:1;padding:6px 8px;font-size:15px;"
      >
    </div>
    `;


    day.exercises.forEach((ex,ei)=>{
      const comment = day.comments?.[ex.name] || "";
      html += `<div class="card">
        <div style="display:flex;justify-content:space-between;align-items:center;">
          <b>${ex.name}</b>
          <button class="icon-btn" onclick="toggleHistory('${ex.name.replace(/'/g,"\\'")}', ${ei})">📜</button>
        </div>

        <div class="small">Hedef: ${ex.sets} x ${ex.reps}</div>
        <textarea id="comment-${ei}" placeholder="📝 Not / Yorum (opsiyonel)" style="width:100%;margin-top:8px;">${comment}</textarea>
        <div id="history-${ei}" style="display:none;margin-top:8px;"></div>
      `;

      for(let s=0;s<ex.sets;s++){
        const old = day.records?.[ex.name]?.[s] || {};
        html += `
          <div class="set-row">
            <input placeholder="Set ${s+1} KG" id="kg-${ei}-${s}" value="${old.kg||""}">
            <input placeholder="Tekrar" id="rep-${ei}-${s}" value="${old.rep||""}">
          </div>
        `;
      }
      html += `</div>`;
    });
// --- Manuel hareket ekleme formu ---
    html += `
      <div class="card">
        <h4>➕ Hareket Ekle</h4>
        <input id="new-ex-name" placeholder="Hareket adı">
        <input id="new-ex-sets" type="number" min="1" placeholder="Set sayısı">
        <button onclick="addExerciseToDay()">➕ Ekle</button>
      </div>
    `;

    html += `
      <div style="height:90px;"></div>
`    ;
    html += `
      <div style="position:sticky; bottom:0; background:white; padding:12px; border-top:1px solid #ddd;">
        <button onclick="finishDayAndGoBack()">✅ Günü Tamamla & Geri Dön</button>
      </div>
    `;

    app.innerHTML = html;

    if(footerHost){
      footerHost.innerHTML = `
        <div class="workout-footer">
          <button onclick="renderProgramDetail()">⬅️ Geri</button>
          <button onclick="saveDay()">💾 Kaydet</button>
        </div>
      `;
    }
  }

  if(state.screen==="measures"){
    const today = new Date().toISOString().slice(0,10);
    let measures = getMeasures().slice().sort((a,b)=> a.date.localeCompare(b.date));

    let list = measures.map(m=>`
      <div class="list-item">
        <div class="list-main">
          <b>${m.date}</b>
          <div class="small">
            Kilo:${m.weight||""} | Bel:${m.waist||""} | Göğüs:${m.chest||""} | Kol:${m.arm||""} | Omuz:${m.shoulder||""} | Kalça:${m.hip||""}
          </div>
        </div>
        <button class="icon-btn" onclick="editMeasure('${m.date}')">✏️</button>
        <button class="icon-btn delete" onclick="deleteMeasure('${m.date}')">🗑️</button>
      </div>
    `).join("");

    app.innerHTML = `
      <div class="card">
        <h3>⚖️ Ölçü Girişi</h3>
        <input type="date" id="m-date" value="${today}">
        <div class="grid">
          <input id="m-weight" placeholder="Kilo">
          <input id="m-waist" placeholder="Bel">
          <input id="m-chest" placeholder="Göğüs">
          <input id="m-arm" placeholder="Kol">
          <input id="m-shoulder" placeholder="Omuz">
          <input id="m-hip" placeholder="Kalça">
        </div>
        <button onclick="saveMeasure()">💾 Kaydet / Güncelle</button>
        <button onclick="goMeasureExport()">📤 Ölçüleri Export</button>
        <button onclick="goMeasureCharts()">📈 Grafikleri Gör</button>
      </div>

      <div class="card">
        <h3>📜 Geçmiş Ölçüler</h3>
        ${list || "<div class='small'>Henüz kayıt yok</div>"}
      </div>

      <button onclick="goHome()">⬅️ Geri</button>
    `;
  }

  if(state.screen==="measureCharts"){
    app.innerHTML = `
      <div class="card">
        <h3>📈 Kilo Grafiği</h3>
        <canvas id="weightChart" width="400" height="260"></canvas>
      </div>

      <div class="card">
        <h3>📈 Ölçü Grafiği</h3>
        <select id="measureSelect" onchange="drawMeasureCharts()">
          <option value="waist">Bel</option>
          <option value="chest">Göğüs</option>
          <option value="arm">Kol</option>
          <option value="shoulder">Omuz</option>
          <option value="hip">Kalça</option>
        </select>
        <canvas id="measureChart" width="400" height="260"></canvas>
      </div>

      <button onclick="goMeasures()">⬅️ Geri</button>
    `;
    drawMeasureCharts();
  }

  if(state.screen==="measureExport"){
    app.innerHTML = `
      <div class="card">
        <h3>📤 Ölçü Export</h3>
        <button onclick="exportMeasuresJSON()">📦 JSON (Yedek)</button>
        <button onclick="exportMeasuresCSV()">📊 CSV (Excel/GPT)</button>
      </div>
      <button onclick="goMeasures()">⬅️ Geri</button>
    `;
  }

  if(state.screen==="programExport"){
    const i = state.exportProgramIndex;
    const programs = getPrograms();
    const p = programs[i];
    app.innerHTML = `
      <div class="card">
        <h3>📤 ${p.name}</h3>
        <button onclick="exportProgramJSON(${i})">📦 Program JSON (Yedek)</button>
        <button onclick="exportProgramCSV(${i})">📊 Program CSV (Antrenman Kayıtları)</button>
      </div>
      <button onclick="goPrograms()">⬅️ Geri</button>
    `;
  }

  if(state.screen==="exerciseCharts"){
    const exercises = collectAllExercises();

    if(exercises.length === 0){
      app.innerHTML = `
        <div class="card">
          <h3>📈 Gelişim Grafikleri</h3>
          <div class="small">Henüz hiç kayıtlı egzersiz yok.</div>
        </div>
        <button onclick="goHome()">⬅️ Geri</button>
      `;
      return;
    }

    let options = exercises.map(e=>`<option value="${e}">${e}</option>`).join("");

    app.innerHTML = `
      <div class="card">
        <h3>📈 Gelişim Grafikleri</h3>
        <select id="exerciseSelect" onchange="drawExerciseChart()">
          ${options}
        </select>
        <canvas id="exerciseChart" width="400" height="260"></canvas>
      </div>
      <button onclick="goHome()">⬅️ Geri</button>
    `;

    drawExerciseChart();
  }

}

// ===== Charts =====
function drawMeasureCharts(){
  let measures = getMeasures().slice().sort((a,b)=> a.date.localeCompare(b.date));

  const weightData = measures.filter(m=>m.weight).map(m=>({x:m.date, v:parseFloat(m.weight)}));
  drawLineChart("weightChart", weightData, "#007aff");

  const key = document.getElementById("measureSelect").value;
  const colorMap = { waist:"#ff9500", chest:"#34c759", arm:"#af52de", shoulder:"#ff3b30", hip:"#5ac8fa" };
  const mData = measures.filter(m=>m[key]).map(m=>({x:m.date, v:parseFloat(m[key])}));
  drawLineChart("measureChart", mData, colorMap[key] || "#000");
}

function drawLineChart(canvasId, data, color){
  const c = document.getElementById(canvasId);
  if(!c) return;
  const ctx = c.getContext("2d");
  ctx.clearRect(0,0,c.width,c.height);

  if(data.length < 1){
    ctx.fillStyle="#999";
    ctx.fillText("Yeterli veri yok", 20, 40);
    return;
  }

  const pad = 40;
  const w = c.width - pad*2;
  const h = c.height - pad*2;

  const minY = Math.min(...data.map(d=>d.v));
  const maxY = Math.max(...data.map(d=>d.v));
  const range = (maxY - minY) || 1;

  // axes
  ctx.strokeStyle="#ccc";
  ctx.beginPath();
  ctx.moveTo(pad,pad);
  ctx.lineTo(pad,pad+h);
  ctx.lineTo(pad+w,pad+h);
  ctx.stroke();

  // labels
  ctx.fillStyle="#666";
  ctx.font="12px sans-serif";
  ctx.fillText(maxY.toFixed(1), 5, pad+5);
  ctx.fillText(minY.toFixed(1), 5, pad+h);

  // line
  ctx.strokeStyle=color;
  ctx.lineWidth=2;
  ctx.beginPath();

  data.forEach((d,i)=>{
    const x = pad + (i/(data.length-1||1))*w;
    const y = pad + h - ((d.v - minY)/range)*h;
    if(i===0) ctx.moveTo(x,y); else ctx.lineTo(x,y);

    ctx.fillStyle=color;
    ctx.beginPath();
    ctx.arc(x,y,3,0,Math.PI*2);
    ctx.fill();
  });

  ctx.stroke();
}

// ===== Program Flow, Import, Export, Measure CRUD =====
// (Bunlar stabil sürümle birebir aynıdır)

function openProgram(i){
  const programs = getPrograms();
  state.selectedProgram = programs[i];
  state.programIndex = i;
  state.screen = "programDetail";
  render();
}
function renderProgramDetail(){ 
  state.screen="programDetail"; 
  render(); 

  // Son güncellemenin yüzdesini zorla tazele
  const info = localStorage.getItem("lastUpdatedDay");
  if(info){
    localStorage.removeItem("lastUpdatedDay");
  }
}

function openDay(i){ state.selectedDayIndex=i; state.screen="workout"; render(); }

function saveDay(){
  const programs = getPrograms();
  const day = programs[state.programIndex].days[state.selectedDayIndex];
  let records = {};
  let comments = {};
  day.exercises.forEach((ex,ei)=>{
    records[ex.name]=[];
    for(let s=0;s<ex.sets;s++){
      const kg = document.getElementById(`kg-${ei}-${s}`).value;
      const rep = document.getElementById(`rep-${ei}-${s}`).value;
      records[ex.name].push({kg,rep});
      const c = document.getElementById(`comment-${ei}`).value;
    if(c && c.trim()){
      comments[ex.name] = c.trim();
    }
    }
  });
  day.records = records;
  const d = document.getElementById("workout-date").value;
  if(d){
    day.date = d;
  }

  day.comments = comments;
  savePrograms(programs);
  // 🔥 KRİTİK: bellekteki programı güncel veriden yenile
  state.selectedProgram = getPrograms()[state.programIndex];

  render();   // sayfayı kapatmıyoruz

  // Gün listesindeki yüzdeyi güncellemek için arka planda sakla
  localStorage.setItem("lastUpdatedDay", 
    JSON.stringify({
      p: state.programIndex,
      d: state.selectedDayIndex,
      t: Date.now()
    })
  );


}
function addExerciseToDay(){
  const name = document.getElementById("new-ex-name").value.trim();
  const sets = parseInt(document.getElementById("new-ex-sets").value);

  if(!name){
    alert("Hareket adı gir.");
    return;
  }
  if(!sets || sets < 1){
    alert("Geçerli set sayısı gir.");
    return;
  }

  const programs = getPrograms();
  const day = programs[state.programIndex].days[state.selectedDayIndex];

  // Aynı isimde hareket var mı?
  if(day.exercises.find(x => x.name.toLowerCase() === name.toLowerCase())){
    if(!confirm("Bu isimde bir hareket zaten var. Yine de eklemek istiyor musun?")){
      return;
    }
  }

  // Yeni hareketi ekle
  day.exercises.push({
    name: name,
    sets: sets,
    reps: ""   // hedef tekrar boş, çünkü manuel
  });

  savePrograms(programs);
  alert("Hareket eklendi ✅");

  // Ekranı yenile
  render();
}

function importProgram(){ document.getElementById("fileInput").click(); }
document.getElementById("fileInput").addEventListener("change", e=>{
  const file = e.target.files[0];
  if(!file) return;
  e.target.value = "";
  const reader = new FileReader();
  reader.onload = evt => parseCSV(evt.target.result);
  reader.readAsText(file);
});

function parseCSV(text){
  const lines = text.replace(/\r/g,"").split("\n").map(l=>l.trim()).filter(l=>l);
  if(lines.length < 2){
    alert("CSV dosyasi bos veya hatali.");
    return;
  }

  const header = parseCSVLine(lines[0]);
  const rows = lines.slice(1).map(parseCSVLine).filter(r=>r.some(x=>x));

  // 1) Plan CSV (Program, Hafta, Gun, Hareket, Set, Tekrar)
  const headerJoined = header.map(x=>x.toLowerCase()).join(",");
  const isPlanCSV = headerJoined.includes("hafta") && headerJoined.includes("hareket");

  // 2) Antrenman kaydi CSV (Program, Gun, Hareket, SetNo, KG, Tekrar, Not?)
  const isWorkoutCSV = headerJoined.includes("setno") && headerJoined.includes("kg") && headerJoined.includes("tekrar");

  if(isPlanCSV){
    importProgramPlanCSV(rows);
    return;
  }

  if(isWorkoutCSV){
    importProgramWorkoutCSV(header, rows);
    return;
  }

  alert("Bu CSV formati taninmiyor. Lutfen uygulamanin verdigi CSV formatini kullan.");
}

function deleteProgram(i){
  if(!confirm("Bu programı silmek istiyor musun?")) return;
  const programs = getPrograms();
  programs.splice(i,1); savePrograms(programs); render();
}
function renameProgram(i){
  const programs = getPrograms();
  const newName = prompt("Yeni program adını gir:", programs[i].name);
  if(!newName) return;
  programs[i].name = newName; savePrograms(programs); render();
}

function downloadFile(filename, content, type){
  const blob = new Blob([content], {type});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = filename;
  a.click();
  URL.revokeObjectURL(a.href);
}

function exportProgramMenu(i){ state.exportProgramIndex=i; state.screen="programExport"; render(); }

function exportProgramJSON(i){
  const programs = getPrograms();
  const data = JSON.stringify(programs[i], null, 2);
  downloadFile(`program_${programs[i].name}.json`, data, "application/json");
}

function exportProgramCSV(i){
  const programs = getPrograms();
  const p = programs[i];
  let rows = [];
  rows.push(["Program","Gün","Hareket","SetNo","KG","Tekrar","Not"].join(","));
  p.days.forEach(d=>{
    if(d.records){
      Object.keys(d.records).forEach(exName=>{
        const note = d.comments?.[exName] || "";
        d.records[exName].forEach((set,idx)=>{
          rows.push([
            csvEscape(p.name),
            csvEscape(d.name),
            csvEscape(exName),
            csvEscape(idx+1),
            csvEscape(set.kg||""),
            csvEscape(set.rep||""),
            csvEscape(note)
          ].join(","));
        });
      });
    }
  });
  const csv = BOM + rows.join("\n");
  downloadFile(`program_${p.name}_antrenman.csv`, csv, "text/csv;charset=utf-8;");
}

function saveMeasure(){
  const m = {
    date: document.getElementById("m-date").value,
    weight: document.getElementById("m-weight").value,
    waist: document.getElementById("m-waist").value,

// ===== BACKUP IMPORT =====

function startImportBackup(){
  document.getElementById("backupInput").value = "";
  document.getElementById("backupInput").click();
}

document.getElementById("backupInput").addEventListener("change", function(e){
  const file = e.target.files[0];
  if(!file) return;

  const reader = new FileReader();
  reader.onload = function(evt){
    try {
      const data = JSON.parse(evt.target.result);
      handleBackupImport(data);
    } catch(err){
      alert("Bu dosya geçerli bir JSON yedeği değil.");
    }
  };
  reader.readAsText(file);
});

function handleBackupImport(data){
  // Tüm veri yedeği mi?
  if(data && data.type === "sporTakipBackup"){
    handleAllDataImport(data);
    return;
  }

  // Program yedeği mi?
  if(data && data.name && data.days){
    importProgramBackup(data);
    return;
  }

  // Ölçü yedeği mi?
  if(Array.isArray(data) && data.length && data[0].date){
    importMeasureBackup(data);
    return;
  }

  alert("Bu dosya tanınan bir yedek formatı değil.");
}

// ---- PROGRAM IMPORT ----
function importProgramBackup(p){
  let programs = getPrograms();

  const existingIndex = programs.findIndex(x => x.name === p.name);

  if(existingIndex !== -1){
    const overwrite = confirm(
      `"${p.name}" adlı bir program zaten var.\n\nOK = Üzerine yaz\nİptal = Kopya olarak ekle`
    );

    if(overwrite){
      programs[existingIndex] = p;
    } else {
      let base = p.name;
      let i = 2;
      let newName = base + "_" + i;
      while(programs.find(x => x.name === newName)){
        i++;
        newName = base + "_" + i;
      }
      const copy = JSON.parse(JSON.stringify(p));
      copy.name = newName;
      programs.push(copy);
    }
  } else {
    programs.push(p);
  }

  savePrograms(programs);
  alert("Program içe aktarıldı ✅");
  render();
}

// ---- MEASURE IMPORT ----
function importMeasureBackup(arr){
  let measures = getMeasures();

  arr.forEach(m=>{
    measures = measures.filter(x => x.date !== m.date);
    measures.push(m);
  });

  saveMeasures(measures);
  alert("Ölçü yedeği içe aktarıldı ✅");
  render();
}

document.getElementById("allDataInput").addEventListener("change", function(e){
  const file = e.target.files[0];
  if(!file) return;
  e.target.value = "";

  const reader = new FileReader();
  reader.onload = function(evt){
    try {
      const data = JSON.parse(evt.target.result);
      handleAllDataImport(data);
    } catch(err){
      alert("Bu dosya geçerli bir JSON yedeği değil.");
    }
  };
  reader.readAsText(file);
});

function handleAllDataImport(data){
  // Accept both envelope and legacy shapes.
  let payload = data;
  if(data && data.type === "sporTakipBackup" && data.data){
    payload = data.data;
  }

  const incomingPrograms = Array.isArray(payload?.programs) ? payload.programs : [];
  const incomingMeasures = Array.isArray(payload?.measures) ? payload.measures : [];

  // If this is not an all-data backup, try to fall back to known importers.
  if(incomingPrograms.length === 0 && incomingMeasures.length === 0){
    if(data && data.name && data.days){ importProgramBackup(data); return; }
    if(Array.isArray(data) && data.length && data[0].date){ importMeasureBackup(data); return; }

    alert("Bu dosya tanınan bir tüm-veri yedeği değil.");
    return;
  }

  const replaceAll = confirm("Tüm veriler içe aktarılacak.\n\nOK = Mevcut verilerin üzerine yaz (sıfırla)\nİptal = Mevcut verilerle birleştir");

  if(replaceAll){
    savePrograms(incomingPrograms);
    saveMeasures(incomingMeasures);

    if(payload?.lastUpdatedDay){
      localStorage.setItem("lastUpdatedDay", payload.lastUpdatedDay);
    } else {
      localStorage.removeItem("lastUpdatedDay");
    }

    alert("Tüm veriler içe aktarıldı ✅");
    goHome();
    return;
  }

  // Merge flow (no per-program prompts).
  const overwriteConflicts = confirm("Aynı isimli programlar varsa nasıl davranalım?\n\nOK = Üzerine yaz\nİptal = Kopya olarak ekle");

  let existingPrograms = getPrograms();
  incomingPrograms.forEach(p=>{
    const idx = existingPrograms.findIndex(x => x.name === p.name);
    if(idx === -1){
      existingPrograms.push(p);
      return;
    }

    if(overwriteConflicts){
      existingPrograms[idx] = p;
      return;
    }

    let base = p.name;
    let i = 2;
    let newName = base + "_" + i;
    while(existingPrograms.find(x => x.name === newName)){
      i++;
      newName = base + "_" + i;
    }
    const copy = JSON.parse(JSON.stringify(p));
    copy.name = newName;
    existingPrograms.push(copy);
  });
  savePrograms(existingPrograms);

  let existingMeasures = getMeasures();
  incomingMeasures.forEach(m=>{
    existingMeasures = existingMeasures.filter(x => x.date !== m.date);
    existingMeasures.push(m);
  });
  saveMeasures(existingMeasures);

  alert("Tüm veriler birleştirildi ✅");
  goHome();
}

// ===== CSV import variants =====
function importProgramPlanCSV(rows){
  if(!rows.length){
    alert("CSV boş.");
    return;
  }

  const programName = (rows[0][0] || "").trim();
  if(!programName){
    alert("Program adı bulunamadı.");
    return;
  }

  let program = { name: programName, days: [] };
  let dayMap = {};

  rows.forEach(r=>{
    const week = (r[1] || "").trim();
    const day = (r[2] || "").trim();
    const exercise = (r[3] || "").trim();
    const sets = parseInt(r[4]);
    const reps = parseInt(r[5]);

    if(!exercise) return;

    const key = `Hafta ${week} Gün ${day}`;
    if(!dayMap[key]){
      dayMap[key] = { name: key, exercises: [] };
      program.days.push(dayMap[key]);
    }
    dayMap[key].exercises.push({
      name: exercise,
      sets: isNaN(sets) ? 0 : sets,
      reps: isNaN(reps) ? "" : reps
    });
  });

  let programs = getPrograms();
  const existingIndex = programs.findIndex(x => x.name === program.name);

  if(existingIndex !== -1){
    const overwrite = confirm(`"${program.name}" adlı bir program zaten var.\n\nOK = Üzerine yaz\nİptal = Kopya olarak ekle`);
    if(overwrite){
      programs[existingIndex] = program;
    } else {
      let base = program.name;
      let i = 2;
      let newName = base + "_" + i;
      while(programs.find(x => x.name === newName)){
        i++;
        newName = base + "_" + i;
      }
      program = JSON.parse(JSON.stringify(program));
      program.name = newName;
      programs.push(program);
    }
  } else {
    programs.push(program);
  }

  savePrograms(programs);
  alert("Program eklendi ✅");
  render();
}

function importProgramWorkoutCSV(header, rows){
  const h = header.map(x=>x.toLowerCase());
  const idxProgram = h.indexOf("program");
  const idxDay = (h.indexOf("gün") !== -1) ? h.indexOf("gün") : h.indexOf("gun");
  const idxEx = h.indexOf("hareket");
  const idxSetNo = h.indexOf("setno");
  const idxKg = h.indexOf("kg");
  const idxRep = h.indexOf("tekrar");
  const idxNote = h.indexOf("not");

  if([idxProgram, idxDay, idxEx, idxSetNo, idxKg, idxRep].some(x=>x === -1)){
    alert("Antrenman CSV basligi eksik/hatali.");
    return;
  }

  const programName = (rows[0]?.[idxProgram] || "").trim();
  if(!programName){
    alert("Program adı bulunamadı.");
    return;
  }

  let program = { name: programName, days: [] };
  let dayMap = {};

  function getDay(dayName){
    if(!dayMap[dayName]){
      dayMap[dayName] = { name: dayName, exercises: [], records: {}, comments: {}, _exMap: {} };
      program.days.push(dayMap[dayName]);
    }
    return dayMap[dayName];
  }

  rows.forEach(r=>{
    const dayName = (r[idxDay] || "").trim();
    const exName = (r[idxEx] || "").trim();
    const setNoRaw = (r[idxSetNo] || "").trim();
    const kg = (r[idxKg] || "").trim();
    const rep = (r[idxRep] || "").trim();
    const note = (idxNote !== -1) ? (r[idxNote] || "").trim() : "";

    if(!dayName || !exName) return;

    const setNo = parseInt(setNoRaw);
    if(isNaN(setNo) || setNo < 1) return;

    const day = getDay(dayName);

    if(!day.records[exName]) day.records[exName] = [];
    while(day.records[exName].length < setNo){
      day.records[exName].push({kg:"", rep:""});
    }
    day.records[exName][setNo-1] = { kg, rep };

    if(note){
      day.comments[exName] = note;
    }

    if(!day._exMap[exName]){
      day._exMap[exName] = { name: exName, sets: 0, reps: "" };
      day.exercises.push(day._exMap[exName]);
    }
    if(setNo > day._exMap[exName].sets){
      day._exMap[exName].sets = setNo;
    }
  });

  program.days.forEach(d=>{ delete d._exMap; });

  // Delegate to JSON program importer to handle name conflicts.
  importProgramBackup(program);
}

function collectAllExercises(){
  const programs = getPrograms();
  const set = new Set();

  programs.forEach(p=>{
    p.days.forEach(d=>{
      if(d.records){
        Object.keys(d.records).forEach(exName=>{
          set.add(exName);
        });
      }
    });
  });

  return Array.from(set).sort();
}

function drawExerciseChart(){
  const name = document.getElementById("exerciseSelect").value;
  const programs = getPrograms();

  let points = [];

  programs.forEach(p=>{
    p.days.forEach(d=>{
      if(d.records && d.records[name]){
        // o günkü en iyi set
        let best = 0;
        d.records[name].forEach(s=>{
          const kg = parseFloat(s.kg);
          if(!isNaN(kg)){
            if(kg > best) best = kg;
          }
        });
        if(best > 0){
          points.push({
            x: d.name,
            v: best
          });
        }
      }
    });
  });

  drawLineChart("exerciseChart", points, "#ff2d55");
}
let openHistoryIndex = null;

function toggleHistory(exName, ei){
  const el = document.getElementById("history-" + ei);

  if(el.style.display === "block"){
    el.style.display = "none";
    el.innerHTML = "";
    openHistoryIndex = null;
    return;
  }

  // başka açık varsa kapat
  if(openHistoryIndex !== null){
    const old = document.getElementById("history-" + openHistoryIndex);
    if(old){
      old.style.display = "none";
      old.innerHTML = "";
    }
  }

  const history = collectExerciseHistory(exName);

  if(history.length === 0){
    el.innerHTML = `<div class="small">Bu hareket için geçmiş kayıt yok.</div>`;
  } else {
    let html = `<div class="small"><b>📜 Son Kayıtlar</b></div>`;

    history.slice(0,3).forEach(h=>{
      html += `<div class="card" style="margin-top:8px;">
        <div class="small"><b>${h.date || "Tarih yok (eski kayıt)"}</b></div>
      `;

      h.sets.forEach((s,idx)=>{
        html += `<div class="small">#${idx+1} ${s.kg || "-"} kg x ${s.rep || "-"}</div>`;
      });

      if(h.comment){
        html += `<div class="small">📝 ${h.comment}</div>`;
      }

      html += `</div>`;
    });

    el.innerHTML = html;
  }

  el.style.display = "block";
  openHistoryIndex = ei;
}

// tüm programlardan o hareketin geçmişini toplar
function collectExerciseHistory(name){
  const programs = getPrograms();
  let list = [];

  programs.forEach(p=>{
    p.days.forEach(d=>{
      if(d.records && d.records[name]){
        list.push({
          date: d.date,
          sets: d.records[name],
          comment: d.comments ? d.comments[name] : ""
        });
      }
    });
  });

  // tarihe göre sırala (yeni → eski)
  list.sort((a,b)=>{
    if(!a.date) return 1;
    if(!b.date) return -1;
    return b.date.localeCompare(a.date);
  });

  return list;
}
function finishDayAndGoBack(){
  saveDay();               // önce kaydet
  state.selectedProgram = getPrograms()[state.programIndex]; // 🔥 KRİTİK SATIR
  renderProgramDetail();   // sonra listeye dön
}

function calculateCompletionRate(day){
  let expectedReps = 0;
  let doneReps = 0;

  // 👉 BEKLENEN: toplam tekrar
  day.exercises.forEach(ex=>{
    const sets = ex.sets || 0;
    const reps = parseInt(ex.reps) || 0;
    expectedReps += sets * reps;
  });

  // 👉 GERÇEK: girilen toplam tekrar
  if(day.records){
    Object.values(day.records).forEach(sets=>{
      sets.forEach(s=>{
        const r = parseInt(s.rep);
        if(!isNaN(r)){
          doneReps += r;
        }
      });
    });
  }

  if(expectedReps === 0) return 0;

  return Math.round((doneReps / expectedReps) * 100);
}
